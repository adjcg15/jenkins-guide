<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi To-Do List</title>
  <link rel="stylesheet" href="index_style.css">
  <script defer src="index_script.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Mi Lista de Tareas</h1>
      <p class="subtitle">Organiza tu día de forma sencilla</p>
    </header>

    <main>
      <div class="input-group">
        <input id="newTodo" type="text" placeholder="Escribe una nueva tarea...">
        <button id="addBtn">Agregar</button>
      </div>

      <ul id="todoList"></ul>
    </main>

    <footer>
      <p>Desarrollado con ❤️ en Java + Spring Boot por Tristán Eduardo Suárez Santiago y Ángel de Jesus de la Cruz García</p>
    </footer>
  </div>
</body>
</html>
